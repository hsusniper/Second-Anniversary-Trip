<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>兩週年東京北海道之旅</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❄️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f8fb; --card:#ffffff; --ink:#16233b; --mute:#5b6b82;
  --snow:#d6e6f2; --line:#d9e3ec; --plum:#9c2f63; --plum-soft:#f6e6ee;
  --serif:"Noto Serif TC","Songti TC",serif; --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1829; --card:#17233a; --ink:#e8eef6; --mute:#9db0c8; --snow:#223653; --line:#2a3b57; --plum:#f08cb5; --plum-soft:#3a2234}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 var(--sans)}
a{color:var(--plum)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--plum);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
header{background:var(--snow);padding:56px 0 40px;border-bottom:1px solid var(--line)}
h1{font:900 clamp(30px,7vw,52px)/1.2 var(--serif);margin:0 0 12px;letter-spacing:.02em}
header p{margin:0;color:var(--mute);font-size:17px}
.stays{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.stays span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:14px}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0)}
nav .wrap{display:flex;gap:6px;overflow-x:auto;padding:10px 20px;scrollbar-width:none}
nav a{flex:none;text-decoration:none;color:var(--ink);padding:4px 12px;border-radius:8px;font-size:14px;font-weight:500}
nav a:hover{background:var(--plum-soft)}
main{padding:32px 0 64px}
.day{display:grid;grid-template-columns:92px 1fr;gap:0 20px;padding:26px 0;border-bottom:1px solid var(--line)}
.date{font:900 34px/1 var(--serif)}
.date small{display:block;font:500 13px/1.6 var(--sans);color:var(--mute);margin-top:6px}
.day h2{font:600 22px/1.4 var(--serif);margin:0}
.city{color:var(--plum);font-size:14px;font-weight:700;margin:0 0 2px}
.flight{display:flex;align-items:center;gap:14px;margin:14px 0;padding:12px 16px;background:var(--card);border:1px dashed var(--plum);border-radius:10px}
.flight b{font:700 20px/1.2 var(--serif)}
.flight span.t{display:block;font-size:13px;color:var(--mute)}
.flight i{flex:1;height:1px;background:var(--plum);position:relative;min-width:30px}
.flight i::after{content:"✈";position:absolute;left:50%;top:-11px;transform:translateX(-50%);background:var(--card);padding:0 6px;color:var(--plum);font-style:normal}
ul.items{list-style:none;margin:10px 0 0;padding:0}
ul.items li{padding:6px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.time{font-weight:700;color:var(--plum);min-width:48px}
.note{color:var(--mute);font-size:14px}
.stay{margin:12px 0 0;font-size:14px;color:var(--mute)}
h2.sec{font:900 28px/1.3 var(--serif);margin:48px 0 6px}
.foods{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:8px}
.foods label{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.foods input{width:20px;height:20px;margin-top:3px;accent-color:var(--plum)}
.foods input:checked + span{text-decoration:line-through;color:var(--mute)}
footer{padding:28px 0 48px;color:var(--mute);font-size:14px;text-align:center}
@media (max-width:560px){
  .day{grid-template-columns:1fr}
  .date{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
  .date small{margin:0}
}
</style>
</head>
<body>
<header><div class="wrap">
  <h1 id="title"></h1>
  <p id="sub"></p>
  <div class="stays" id="stays"></div>
</div></header>
<nav aria-label="日期"><div class="wrap" id="nav"></div></nav>
<main class="wrap">
  <div id="days"></div>
  <h2 class="sec" id="food">北海道待吃清單</h2>
  <p class="note">點一下就能打勾，進度只會存在你自己的瀏覽器。</p>
  <ul class="foods" id="foods"></ul>
</main>
<footer>祝我們旅途愉快 ❄️</footer>

<script src="data.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mapUrl = (name, custom) => custom || "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(name);
const link = (name, custom) => `<a href="${esc(mapUrl(name, custom))}" target="_blank" rel="noopener">${esc(name)}</a>`;

document.title = TRIP.title;
$("title").textContent = TRIP.title;
$("sub").textContent = TRIP.subtitle;
$("stays").innerHTML = TRIP.hotels.map(h => `<span>🏨 ${link(h.name)}　${esc(h.dates)}</span>`).join("");
$("nav").innerHTML = TRIP.days.map(d => `<a href="#d${d.date.replace("/","-")}">${esc(d.date)}</a>`).join("") + `<a href="#food">美食</a>`;

$("days").innerHTML = TRIP.days.map(d => {
  const fl = (d.flights || []).map(f => `
    <div class="flight">
      <div><b>${esc(f.from)}</b><span class="t">${esc(f.dep)}</span></div><i></i>
      <div style="text-align:right"><b>${esc(f.to)}</b><span class="t">${esc(f.arr)}</span></div>
    </div>`).join("");
  const items = (d.items || []).map(it => {
    const o = typeof it === "string" ? { t: it } : it;
    return `<li>${o.time ? `<span class="time">${esc(o.time)}</span>` : ""}<span>${link(o.t, o.map)}</span>${o.note ? `<span class="note">${esc(o.note)}</span>` : ""}</li>`;
  }).join("");
  return `<section class="day" id="d${d.date.replace("/","-")}">
    <div class="date">${esc(d.date)}<small>週${esc(d.wd)}</small></div>
    <div>
      <p class="city">${esc(d.city)}</p><h2>${esc(d.title)}</h2>
      ${fl}<ul class="items">${items}</ul>
      ${d.hotel ? `<p class="stay">住宿：${link(d.hotel)}</p>` : ""}
    </div></section>`;
}).join("");

let saved = {};
try { saved = JSON.parse(localStorage.getItem("trip-foods") || "{}"); } catch (e) {}
$("foods").innerHTML = TRIP.foods.map((f, i) => `<li><label>
  <input type="checkbox" data-i="${i}" ${saved[i] ? "checked" : ""}>
  <span>${f.star ? "⭐ " : ""}${link(f.name, f.map)}${f.note ? ` <span class="note">${esc(f.note)}</span>` : ""}</span>
</label></li>`).join("");
$("foods").addEventListener("change", e => {
  if (!e.target.matches("input")) return;
  saved[e.target.dataset.i] = e.target.checked;
  try { localStorage.setItem("trip-foods", JSON.stringify(saved)); } catch (err) {}
});
</script>
</body>
</html>
